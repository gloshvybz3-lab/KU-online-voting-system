services:
  web:
    build: .
    env_file: .env
    depends_on: [mysql, redis]
    ports: ["8000:8000"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ku_voting
      MYSQL_USER: ku_app
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_root_password
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
volumes:
  mysql_data:
  redis_data:
