services:
  - type: web
    name: ku-online-voting
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "True"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      # If using a Render PostgreSQL database, connect it and set DATABASE_URL
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: ku-voting-db
      #     property: connectionString
