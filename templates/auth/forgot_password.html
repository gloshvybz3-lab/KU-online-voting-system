{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
                <h4><i class="fas fa-key me-2"></i>Forgot Password</h4>
                <p class="mb-0 text-white-50">Enter your email to receive an OTP code</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Registered Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="student@ku.ac.ke" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">Send Verification Code</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
