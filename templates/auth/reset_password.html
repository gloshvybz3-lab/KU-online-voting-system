{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-success text-white text-center py-4">
                <h4><i class="fas fa-shield-alt me-2"></i>Reset Password</h4>
                <p class="mb-0 text-white-50">Enter the 6-digit verification code sent to your email</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-3">
                        <label class="form-label">6-Digit Verification Code (OTP)</label>
                        <input type="text" name="otp" class="form-control text-center fs-4 letter-spacing" placeholder="123456" maxlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="Minimum 8 characters" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
